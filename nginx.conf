# El formato de fábrica anota el código pero no cuánto se tardó, y sin eso un
# 200 que llegó tarde es indistinguible de uno que llegó a tiempo -- que es
# justo la diferencia entre que Discord enseñe la respuesta o escriba «la
# aplicación no respondió» a los tres segundos. `$request_time` es lo que tardó
# la petición entera; `$upstream_response_time`, lo que tardó la API, así que la
# resta de los dos es lo que puso la red.
#
# Va fuera del `server` porque `log_format` sólo vale en contexto `http`, y este
# fichero se incluye ahí dentro desde conf.d.
log_format tiempos '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent $request_time $upstream_response_time '
                   '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log tiempos;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving the upstream at request time rather than
    # at startup keeps nginx from refusing to boot when the API is still coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
