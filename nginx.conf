# El formato de fábrica anota el código pero no cuánto se tardó, y sin eso un
# 200 que llegó tarde es indistinguible de uno que llegó a tiempo -- que es
# justo la diferencia entre que Discord enseñe la respuesta o escriba «la
# aplicación no respondió» a los tres segundos. `$request_time` es lo que tardó
# la petición entera; `$upstream_response_time`, lo que tardó la API, así que la
# resta de los dos es lo que puso la red.
#
# Va fuera del `server` porque `log_format` sólo vale en contexto `http`, y este
# fichero se incluye ahí dentro desde conf.d.
log_format tiempos '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent $request_time $upstream_response_time '
                   '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log tiempos;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving the upstream at request time rather than
    # at startup keeps nginx from refusing to boot when the API is still coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El gancho de tusd sólo lo llama tusd, y los dos están en la misma red de
    # Docker. Desde fuera no tiene por qué existir. El secreto en la URL ya lo
    # protege; esto es la segunda vuelta de llave, y es gratis.
    #
    # Gana a `/api/` sin depender del orden: entre dos prefijos, nginx se queda
    # con el más largo.
    location /api/vods/hook {
        return 404;
    }

    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subida de grabaciones de guerra, hacia tusd. Ver docs/VODS.md.
    #
    # `proxy_request_buffering off` no es afinado, es obligatorio: sin él nginx
    # se traga los 2 GB en su propio disco antes de reenviar ni un byte, y ese
    # disco es el del contenedor, que tiene ~18 GiB. La primera subida grande
    # llenaría el LXC y se llevaría por delante todo lo que corre dentro.
    #
    # `client_max_body_size 0` quita el tope de nginx porque el que manda es el
    # de tusd (-max-size), que además sabe rechazarlo antes de recibir el
    # fichero entero.
    location /vods-upload/ {
        # 8080 es el puerto por defecto de tusd v2 (la v1 usaba 1080). Va
        # además fijado a mano en su `command` del compose, para que este
        # número y aquél no puedan separarse en silencio.
        set $tusd_upstream http://tusd:8080;
        proxy_pass $tusd_upstream$request_uri;

        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;

        # Una subida de 2 GB por una línea lenta tarda más que el minuto de
        # fábrica.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
