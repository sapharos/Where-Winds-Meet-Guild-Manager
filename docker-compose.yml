services:
  web:
    build:
      context: .
    image: wwm-guild-manager-web:latest
    container_name: wwm-guild-manager-web
    ports:
      - "${WEB_PORT:-8085}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./server
    image: wwm-guild-manager-api:latest
    container_name: wwm-guild-manager-api
    environment:
      # Points at your existing PostgreSQL. See .env.example. The API refuses to
      # start, with an explanatory log line, if this is left empty.
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      GUILD_ID: ${GUILD_ID:-default-guild}
      GUILD_NAME: ${GUILD_NAME:-My Guild}
      # Signs session cookies. Leave empty and one is generated and kept in the
      # database; set it to rotate every session out.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Set to true once the app is reached over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Used only to create the very first account. After that, manage accounts
      # in the app; changing these does nothing.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Signing in with Discord. Leave these empty and the button is simply not
      # offered; the password form keeps working either way.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # The address members reach the app at, which is where Discord sends them
      # back. Must match the redirect URI registered with Discord exactly.
      PUBLIC_URL: ${PUBLIC_URL:-}
    restart: unless-stopped

# The API talks to a PostgreSQL that lives outside this stack. Attach the
# network your database is already on and uncomment, so "api" can resolve it
# by container name.
#
# networks:
#   default:
#     name: <your-postgres-network>
#     external: true
